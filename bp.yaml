# bp.yaml — which model plays which role.
#
# The system never names a model in its code; it names a role. Change a line
# here and the whole system uses a different model for that job. Nothing else
# has to change.
#
# Backends:
#   claude_api   metered Anthropic API   ANTHROPIC_API_KEY, or `ant auth login`
#   openai_api   metered OpenAI API      OPENAI_API_KEY
#   claude_cli   `claude -p`             a Claude subscription; no per-call price
#   codex_cli    `codex exec`            a Codex subscription; no per-call price
#   scripted     canned replies          tests only
#
# `bp agents` prints this table and says which backends can actually run here.
#
# This machine has the `claude` and `codex` CLIs and no API key, so the roles
# below use the subscription backends. To move to the metered API instead,
# replace a line with e.g. `{backend: claude_api, model: claude-opus-5}` — the
# API backends report tokens, so the dollar cap below starts to bite; with CLI
# backends the call cap is the only thing that limits a run.

agents:
  roles:
    # Proposes decompositions. The most demanding role: it has to produce a
    # reduction proof and a complete discharge table in one shot.
    #
    # `command` is spelled out because a Codex CLI signed in with a ChatGPT
    # account rejects an explicit --model. This is why the command is
    # configuration and not a constant in the Python.
    decomposer:
      backend: codex_cli
      model: default
      options:
        command: [codex, exec, --skip-git-repo-check]
      timeout: 900

    # Reads a decomposition back: does the reduction establish the parent, and
    # is any child secretly the parent again. Two separate calls.
    checker: {backend: claude_cli, model: opus, timeout: 900}

    # The verifier panel. These two are models from *different families* — that
    # is the entire reason there are two of them. Two verifiers from the same
    # lab miss the same things, and the second one costs as much either way.
    verifier_a: {backend: claude_cli, model: opus, timeout: 900}
    verifier_b:
      backend: codex_cli
      model: default
      options:
        command: [codex, exec, --skip-git-repo-check]
      timeout: 900

    # Writes proofs for routine and standard leaves only. Never sets a status.
    prover: {backend: claude_cli, model: sonnet, timeout: 900}

budget:
  # A run stops before the call that would cross either cap. The dollar cap only
  # constrains calls whose price is known; a subscription CLI reports no price,
  # so with the configuration above the call cap is the one that bites. Keep it
  # set.
  per_recompile_usd: 3.0
  max_calls_per_recompile: 40

# Published list prices, US dollars per million tokens. Used for `--dry-run`
# estimates and the budget cap. `bp` ships defaults for the current Claude
# models; add an entry here for anything else, or to override a price.
pricing: {}
