# bp.yaml — which model plays which role.
#
# The system never names a model in its code; it names a role. Change a line
# here and the whole system uses a different model for that job.
#
# Backends:
#   claude_api   metered Anthropic API   ANTHROPIC_API_KEY, or `ant auth login`
#   openai_api   metered OpenAI API      OPENAI_API_KEY
#   claude_cli   `claude -p`             a Claude subscription; no per-call price
#   codex_cli    `codex exec`            a Codex subscription; no per-call price
#   scripted     canned replies          tests only
#
# `bp agents` prints this table and says which backends can actually run here.
#
# --- current setup: every role on GPT-5.6 Sol through the Codex CLI ----------
#
# `command` is spelled out per role because the effort level is a Codex config
# override (`-c model_reasoning_effort=…`) rather than a flag the backend knows
# about. That is exactly what `options.command` exists for: CLI flags drift, and
# you should be able to follow that without editing Python.
#
# The effort ladder Codex accepts is:
#     none · minimal · low · medium · high · xhigh · max
# so `max` is the highest and `xhigh` the second. Higher effort costs *time*, not
# money, on a subscription — but the time is real: a decomposition at `max` can
# run half an hour, and a recompile makes twenty or more calls.
#
# ⚠️  ONE THING YOU ARE GIVING UP. `verifier_a` and `verifier_b` are meant to be
# models from *different families* — that is the entire reason there are two of
# them, because two verifiers trained by the same lab miss the same things. With
# both on Sol the panel is two samples from one model, which is worth much less.
# To get it back, change verifier_b to one line:
#     verifier_b: {backend: claude_cli, model: opus, timeout: 1800}
# or, with an ANTHROPIC_API_KEY:
#     verifier_b: {backend: claude_api, model: claude-opus-5, timeout: 1800}

agents:
  roles:
    # Proposes decompositions. The most demanding role in the system: it has to
    # produce the children, a reduction proof, and a complete discharge table in
    # one shot. It also runs least often, so it gets `max`.
    decomposer:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=max]
      timeout: 3600

    # Reads a decomposition back: does the reduction establish the parent, and
    # is any child secretly the parent again. Two separate calls.
    checker:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=xhigh]
      timeout: 2400

    # --- the tiered half -----------------------------------------------------
    #
    # Reads a proof and lists every load-bearing claim with the source the prose
    # offers. This is TRANSLATION, not judgement, which is why it is the cheap
    # model and why its output is trustworthy enough to be a computed field. On a
    # subscription the tier costs time rather than money, so it runs at `low`.
    extractor:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=low]
      timeout: 900

    # The narrow entailment checks: does this source give this hypothesis, and
    # does this source justify this claim. These are most of the calls a deep
    # recompile makes — a ten-claim proof is roughly fifteen calls — so this is
    # the role to move if a recompile is taking too long.
    obligation:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=medium]
      timeout: 1800

    # The verifier panel: the whole-proof pass. See the warning above — these
    # should not be the same model. Both are on Sol only because that is what was
    # asked for.
    verifier_a:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=xhigh]
      timeout: 2400
    verifier_b:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=xhigh]
      timeout: 2400

    # Re-reads every objection with its surrounding context and drops the ones
    # that dissolve. Do not economise here: without it the objection list is
    # mostly pedantry, you stop reading it, and the one real finding goes too.
    confirmer:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=xhigh]
      timeout: 2400

    # Four questions about a statement, with no proof in view: well-posedness, a
    # vacuity witness, quantifier order, and whether a constant depends on
    # something it is treated as uniform in. Runs at `--level deep` only.
    auditor:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=xhigh]
      timeout: 2400

    # Writes proofs for routine and standard leaves only. Never sets a status.
    prover:
      backend: codex_cli
      model: gpt-5.6-sol
      options:
        command: [codex, exec, --skip-git-repo-check,
                  --model, gpt-5.6-sol,
                  -c, model_reasoning_effort=xhigh]
      timeout: 2400

budget:
  # A run stops before the call that would cross either cap. The dollar cap only
  # constrains calls whose price is known; a subscription CLI reports no price,
  # so with this configuration the CALL CAP is the only thing limiting a run.
  #
  # Agent-checking every claim is expensive: a node with a ten-claim proof runs
  # roughly fifteen calls at `--level deep`, so a thirty-node graph is several
  # hundred. `bp recompile --dry-run --level deep` prints the bill before you pay
  # it, and `--level` is the knob that actually controls cost. Keep the call cap
  # set — at `max` effort, forty calls is a long afternoon.
  per_recompile_usd: 3.0
  max_calls_per_recompile: 40

# Published list prices, US dollars per million tokens, for `--dry-run`
# estimates. Subscription backends report no price, so nothing here applies to
# the configuration above; add an entry if you move a role onto a metered API.
pricing: {}
