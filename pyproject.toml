[project]
name = "albatross-bp"
version = "0.1.0"
description = "Albatross / Blueprint v0 — an interactive proof-decomposition assistant"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "python-frontmatter",
    "ruamel.yaml",
    "networkx",
    "jinja2",
    "typer",
    "rich",
    "fastapi",
    "uvicorn",
    "watchfiles",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bp = "bp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bp*"]

[tool.setuptools.package-data]
# Everything here is loaded at runtime by path, so a wheel that omits any of it
# installs a broken program. The first version shipped only the Jinja template,
# which meant an installed copy had no web interface (`bp ui` served nothing) and
# no prompts (every role died with "missing prompt file"). There is a test that
# builds a wheel and checks these are present.
bp = [
    "templates/*.j2",
    "templates/*.yaml",
    "roles/prompts/*.md",
    "ui/static/*",
    "ui/static/vendor/*",
    "ui/static/vendor/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
